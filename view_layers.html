<style>
  #sig-map-panels{

        position:absolute;

        top:70px;

        right:15px;

        width:300px;

        z-index:900;

    }

    #sig-layers-body{

        max-height:220px;

        overflow-y:auto;

    }

    #sig-layers-body::-webkit-scrollbar,
    #sig-datalayers-body::-webkit-scrollbar{

        width:8px;

    }

    #sig-layers-body::-webkit-scrollbar-thumb,
    #sig-datalayers-body::-webkit-scrollbar-thumb{

        background:#c0c0c0;

        border-radius:10px;

    }

    #sig-datalayers-section{

        border-top:1px solid #dee2e6;

    }

    #sig-datalayers-section .section-title{

        font-size:.7rem;

        text-transform:uppercase;

        color:#6c757d;

        padding:6px 12px 2px;

    }

    #sig-datalayers-body{

        max-height:250px;

        overflow-y:auto;

    }

    .sig-datalayer-filtros{

        padding:4px 12px 8px 34px;

        background:#f8f9fa;

    }

    .sig-datalayer-filtro{

        margin-bottom:6px;

    }

    .sig-datalayer-filtro label{

        font-size:.72rem;

        color:#6c757d;

        margin-bottom:2px;

    }
</style>
<div id="sig-map-panels">

<div id="sig-layers-panel" class="card shadow">

    <div class="card-header d-flex align-items-center">

        <span class="me-auto">

            <i class="bi bi-layers"></i>

            Capas y datos

        </span>

        <div class="btn-group btn-group-sm me-2">

            <button
                id="btn-regiones"
                class="btn btn-outline-secondary"
                title="Regiones">

                R

            </button>

            <button
                id="btn-provincias"
                class="btn btn-outline-secondary"
                title="Provincias">

                P

            </button>

            <button
                id="btn-municipios"
                class="btn btn-outline-secondary"
                title="Municipios">

                M

            </button>

        </div>

        <button
            id="btn-zoom-all"
            class="btn btn-sm btn-outline-secondary me-1"
            title="Zoom a todas">

            <i class="bi bi-arrows-fullscreen"></i>

        </button>

        <button
            id="btn-toggle-list"
            class="btn btn-sm btn-outline-secondary"
            title="Mostrar/Ocultar">

            <i class="bi bi-chevron-up"></i>

        </button>

    </div>

    <div id="sig-panel-colapsable">

        <div
            id="sig-layers-body"
            class="list-group list-group-flush">

        </div>

        <div class="card-footer text-muted small">

            <span id="sig-layers-count">

                0 capas

            </span>

        </div>

        <!-- ===================================== -->
        <!-- Datos: una fila por unidad con geometrías en el mapa
             (Riego, Residuos Sólidos, Forestación...) — mismo
             check para prender/apagar que las capas de arriba.
             "Filtros" despliega los selects de esa unidad puntual,
             para no apilar todo siempre. -->
        <!-- ===================================== -->

        <div id="sig-datalayers-section">

            <div class="section-title">Datos</div>

            <div
                id="sig-datalayers-body"
                class="list-group list-group-flush">
            </div>

        </div>

    </div>

</div>

</div>
