<script>

SIG.Features = (()=>{

    //--------------------------------------------------
    // Geometrías cargadas
    //--------------------------------------------------

    const features = {};

    //--------------------------------------------------
    // Evitar HTML/script sueltos en un popup (los valores
    // vienen de celdas de la hoja, no son de confiar a ciegas)
    //--------------------------------------------------

    function escapeHtml(texto){

        return String(texto ?? "")

            .replace(/&/g,"&amp;")

            .replace(/</g,"&lt;")

            .replace(/>/g,"&gt;");

    }

    //--------------------------------------------------
    // Popup: qué registro UD_ es esta geometría (cruce por
    // SIG_GEOMETRIAS_ID), con los campos VISIBLE_MAPA del
    // esquema de esa unidad. Sin registro cruzado, se usa el
    // nombre/descripción propios de SIG_GEOMETRIAS si hay.
    //--------------------------------------------------

    function buildPopup(item){

        if(item.registro){

            const filas = item.registro.campos

                .map(campo =>

                    "<tr><td class='text-muted pe-2'>" +
                    escapeHtml(campo.etiqueta) +
                    "</td><td><strong>" +
                    escapeHtml(campo.valor || "—") +
                    "</strong></td></tr>"

                )

                .join("");

            return(

                "<div class='small'>" +
                "<div class='fw-bold mb-1'>" +
                escapeHtml(item.registro.etiqueta) +
                "</div>" +
                "<table>" + filas + "</table>" +
                "</div>"

            );

        }

        if(item.nombre){

            return(

                "<div class='small'>" +
                escapeHtml(item.nombre) +
                "</div>"

            );

        }

        return null;

    }

    //--------------------------------------------------
    // Cargar una geometría
    //--------------------------------------------------

    function load(item){

        const feature = item.feature;

        const layer = L.geoJSON(

            feature,

            {

                style:()=>SIG.Styles.get(

                    item.estilo_id

                ),

                pointToLayer:(feature,latlng)=>{

                    return L.circleMarker(

                        latlng,

                        SIG.Styles.get(

                            item.estilo_id

                        )

                    );

                }

            }

        );

        const popup = buildPopup(item);

        if(popup){

            layer.bindPopup(popup);

        }

        layer.addTo(

            SIG.Map.get()

        );

        features[item.id]={

            data:item,

            leaflet:layer

        };

        return features[item.id];

    }

    //--------------------------------------------------
    // Cargar varias
    //--------------------------------------------------

    function loadMany(items){

        items.forEach(item=>{

            load(item);

        });

        console.log(

            "Geometrías:",

            Object.keys(features).length

        );

    }

    //--------------------------------------------------
    // Obtener
    //--------------------------------------------------

    function get(id){

        return features[id] || null;

    }

    //--------------------------------------------------
    // Existe
    //--------------------------------------------------

    function exists(id){

        return id in features;

    }

    //--------------------------------------------------
    // Eliminar
    //--------------------------------------------------

    function remove(id){

        const item = features[id];

        if(!item){

            return;

        }

        SIG.Map.get().removeLayer(

            item.leaflet

        );

        delete features[id];

    }

    //--------------------------------------------------
    // Limpiar
    //--------------------------------------------------

    function clear(){

        Object.keys(features).forEach(id=>{

            remove(id);

        });

    }

    //--------------------------------------------------
    // Estadísticas
    //--------------------------------------------------

    function stats(){

        return{

            total:Object.keys(features).length

        };

    }

    //--------------------------------------------------

    return{

        load,
        loadMany,
        get,
        exists,
        remove,
        clear,
        stats

    };

})();

</script>
