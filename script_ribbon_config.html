<script>
SIG.Ribbon.addTab({

    id:"mapa",

    text:"Mapa",

    onShow:()=>SIG.Views.show("map")

});

SIG.Ribbon.addGroup(

    "mapa",

    {

        id:"nav",

        text:"Navegación"

    }

);

SIG.Ribbon.addButton(

    "mapa",

    "nav",

    {

        text:"Capas",

        icon:"bi bi-layers",

        click:()=>SIG.LayerPanel.toggle()

    }

);

SIG.Ribbon.addButton(

    "mapa",

    "nav",

    {

        text:"Zoom",

        icon:"bi bi-arrows-fullscreen",

        click:()=>SIG.Layers.zoomAll()

    }

);

//--------------------------------------------------
// Pestaña Datos
//--------------------------------------------------

SIG.Ribbon.addTab({

    id:"datos",

    text:"Datos"

});

SIG.Ribbon.addGroup(

    "datos",

    {

        id:"unidades",

        text:"Unidades"

    }

);

//--------------------------------------------------
// Pestaña Resumen
//--------------------------------------------------

SIG.Ribbon.addTab({

    id:"resumen",

    text:"Resumen"

});

SIG.Ribbon.addGroup(

    "resumen",

    {

        id:"unidades",

        text:"Unidades"

    }

);

//--------------------------------------------------
// Un botón por cada hoja UD_* que exista en el spreadsheet
// (backend, no hardcodeado) — se agregan cuando llega la
// respuesta, y se refresca el ribbon por si ya estaba
// mostrando la pestaña Datos o Resumen.
//--------------------------------------------------

SIG.Loading.show("Cargando unidades...");

google.script.run

    .withSuccessHandler(unidades=>{

        console.log("[script_ribbon_config] unidades:", unidades);

        SIG.Loading.hide();

        unidades.forEach(u=>{

            SIG.Ribbon.addButton(

                "datos",

                "unidades",

                {

                    text: u.etiqueta,

                    icon: "bi bi-table",

                    click: ()=>SIG.Table.show(u.hoja)

                }

            );

            SIG.Ribbon.addButton(

                "resumen",

                "unidades",

                {

                    text: u.etiqueta,

                    icon: "bi bi-graph-up",

                    click: ()=>SIG.Summary.show(u.hoja)

                }

            );

        });

        SIG.Ribbon.refresh();

    })

    .withFailureHandler(error=>{

        console.error(

            "[script_ribbon_config] error en SIG_UD_listUnidades:",
            error

        );

        SIG.Loading.error(

            "No se pudo cargar la lista de unidades: " + error.message

        );

    })

    .SIG_UD_listUnidades();

console.log("[script_ribbon_config] cargado");
</script>
