<script>

SIG.Selection = (() => {

    let selectedLayer = null;

    //--------------------------------------------------
    // Seleccionar geometría
    //--------------------------------------------------

    function select(layer){

        clear();

        selectedLayer = layer;

        highlight(layer);

        console.log("Seleccionado:", layer);

    }

    //--------------------------------------------------
    // Quitar selección
    //--------------------------------------------------

    function clear(){

        if(!selectedLayer) return;

        resetStyle(selectedLayer);

        selectedLayer = null;

    }

    //--------------------------------------------------
    // Obtener selección
    //--------------------------------------------------

    function get(){

        return selectedLayer;

    }

    //--------------------------------------------------
    // ¿Existe selección?
    //--------------------------------------------------

    function has(){

        return selectedLayer !== null;

    }

    //--------------------------------------------------
    // Resaltar
    //--------------------------------------------------

    function highlight(layer){

        if(layer.setStyle){

            layer.setStyle({

                weight:6

            });

        }

    }

    //--------------------------------------------------
    // Restaurar estilo
    //--------------------------------------------------

    function resetStyle(layer){

        if(layer.estilo_id){

            SIG.Styles.apply(layer, layer.estilo_id);

        }

    }

    //--------------------------------------------------
    // Registrar eventos de una geometría
    //--------------------------------------------------

    function register(layer){

      layer.on("click", () => {

          select(layer);

      });

      layer.on("dblclick",(e)=>{

        L.DomEvent.stopPropagation(e);

        SIG.Modal.open({

          title:"Editar geometría",

          component:"view-geometry",

          data:{

              layer:layer,

              mode:"edit"

          },

          onOpen:(ctx)=>{

              const form = document.querySelector("#sig-modal-body");

              const item = ctx.data.layer.geometriaData;

              if(item){

                  SIG.Geometry.prefill(form, item);

              }

              const seleccionActual = item && item.registro

                  ? {

                      hoja: item.registro.hoja,

                      registroId: item.registro.registroId

                    }

                  : null;

              SIG.Geometry.setupLinkFields(form, seleccionActual);

              SIG.Geometry.setupCapaEstiloFields(

                  form,
                  item ? item.capa_id : null,
                  item ? item.estilo_id : null

              );

              const btnDelete = form.querySelector("#btn-delete-geometry");

              if(btnDelete){

                  btnDelete.onclick = ()=>{

                      SIG.Geometry

                          .remove(ctx.data.layer)

                          .then(SIG.Modal.hide)

                          .catch(()=>{});

                  };

              }

          },

          onSave:(ctx)=>{

              const form = document.querySelector("#sig-modal-body");

              return SIG.Geometry.save(ctx.data.layer, form);

          }

        });

      });

    }

    //--------------------------------------------------

    return{

        register,
        select,
        clear,
        get,
        has

    };

})();

</script>
