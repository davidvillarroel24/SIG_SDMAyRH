<script>

//--------------------------------------------------
// Helpers chicos compartidos entre módulos — evita que cada
// uno reescriba su propio escapeHtml/formatNumber.
//--------------------------------------------------

SIG.Utils = (()=>{

    //--------------------------------------------------
    // Evitar HTML/script sueltos en contenido armado a mano
    // (valores de celdas de la hoja, no son de confiar a ciegas)
    //--------------------------------------------------

    function escapeHtml(texto){

        return String(texto ?? "")

            .replace(/&/g,"&amp;")

            .replace(/</g,"&lt;")

            .replace(/>/g,"&gt;");

    }

    //--------------------------------------------------
    // Formato numérico local (es-BO)
    //--------------------------------------------------

    function formatNumber(valor){

        return new Intl.NumberFormat(

            "es-BO",

            { maximumFractionDigits:2 }

        ).format(valor);

    }

    //--------------------------------------------------
    // Envolver google.script.run en una Promise — mismo patrón
    // que ya tenía SIG.Loader.load() a mano, ahora reutilizable
    // por cualquier módulo (guardado de geometrías/registros).
    //--------------------------------------------------

    function run(nombreFuncion, ...args){

        return new Promise((resolve, reject)=>{

            google.script.run

                .withSuccessHandler(resolve)

                .withFailureHandler(reject)

                [nombreFuncion](...args);

        });

    }

    //--------------------------------------------------
    // Confirmación de una acción — reemplaza confirm() nativo
    // (bloqueante, sin estilo, distinto en cada navegador) por
    // SweetAlert2. Devuelve una Promise<boolean>: true si el
    // usuario confirmó, false si canceló o cerró el diálogo.
    //--------------------------------------------------

    function confirmar({

        titulo,
        texto = "",
        confirmarTexto = "Sí",
        cancelarTexto = "Cancelar",
        icono = "warning",
        colorConfirmar = "#dc3545"

    } = {}){

        return Swal.fire({

            title             : titulo,
            text              : texto,
            icon              : icono,
            showCancelButton  : true,
            confirmButtonText : confirmarTexto,
            cancelButtonText  : cancelarTexto,
            confirmButtonColor: colorConfirmar,
            reverseButtons    : true

        }).then(resultado => resultado.isConfirmed);

    }

    //--------------------------------------------------
    // Alerta simple (informativa) — reemplaza alert() nativo.
    //--------------------------------------------------

    function avisar(titulo, texto = "", icono = "info"){

        return Swal.fire({

            title : titulo,
            text  : texto,
            icon  : icono

        });

    }

    //--------------------------------------------------

    return{

        escapeHtml,
        formatNumber,
        run,
        confirmar,
        avisar

    };

})();

console.log("[SIG.Utils] módulo cargado");

</script>
