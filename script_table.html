<script>

SIG.Table = (()=>{

    let dataTable = null;

    let currentHoja = null;

    //--------------------------------------------------
    // Mostrar la tabla de una hoja UD_ (carga si hace falta)
    //--------------------------------------------------

    function show(hoja){

        console.log("[SIG.Table] show:", hoja);

        SIG.Views.show("sig-table-view");

        if(hoja === currentHoja){

            console.log("[SIG.Table] ya estaba cargada, no se vuelve a pedir:", hoja);

            return;

        }

        currentHoja = hoja;

        document.getElementById("sig-table-title").textContent = hoja;

        console.log("[SIG.Table] pidiendo SIG_UD_get:", hoja);

        SIG.Loading.show("Cargando " + hoja + "...");

        google.script.run

            .withSuccessHandler(resultado => render(hoja, resultado))

            .withFailureHandler(onError)

            .SIG_UD_get(hoja);

    }

    //--------------------------------------------------
    // Volver al mapa
    //--------------------------------------------------

    function hide(){

        SIG.Views.show("map");

    }

    //--------------------------------------------------
    // Columnas visibles en tabla, según el esquema dinámico
    //--------------------------------------------------

    function buildColumns(schema){

        const columnas = schema

            .filter(campo => campo.visibleTabla)

            .map(campo => ({

                data  : campo.columna,

                title : campo.etiqueta || campo.columna

            }));

        // Columna de acción (editar) al final — no sale del
        // esquema, se agrega siempre que haya al menos una
        // columna visible (si no hay ninguna, ya se muestra el
        // aviso de "sin configurar" en vez de la tabla).

        columnas.push({

            data           : null,

            title          : "",

            orderable      : false,

            className      : "text-center",

            defaultContent :

                '<button type="button" ' +
                'class="btn btn-sm btn-outline-secondary btn-editar-registro" ' +
                'title="Editar">' +
                '<i class="bi bi-pencil-square"></i>' +
                '</button> ' +
                '<button type="button" ' +
                'class="btn btn-sm btn-outline-danger btn-eliminar-registro" ' +
                'title="Eliminar">' +
                '<i class="bi bi-trash"></i>' +
                '</button>'

        });

        return columnas;

    }

    //--------------------------------------------------
    // Reemplazar la <table> entera por una limpia. DataTables
    // asocia su instancia a los <th> puntuales que existían al
    // inicializar — reusar el mismo nodo y solo cambiarle las
    // columnas por dentro (aunque sea después de destroy()) deja
    // referencias viejas dando vueltas y termina en warnings tipo
    // "Cannot reinitialise"/"Incorrect column count". Empezar de
    // un <table> que DataTables nunca vio evita el problema de raíz.
    //--------------------------------------------------

    function resetTableElement(){

        const anterior = document.getElementById(

            "sig-table-datatable"

        );

        const nueva = document.createElement("table");

        nueva.id = anterior.id;

        nueva.className = anterior.className;

        nueva.innerHTML =

            '<thead><tr id="sig-table-head-row"></tr></thead><tbody></tbody>';

        anterior.replaceWith(nueva);

    }

    //--------------------------------------------------
    // Dibujar encabezados según las columnas del esquema
    //--------------------------------------------------

    function buildHead(columnas){

        const headRow = document.getElementById(

            "sig-table-head-row"

        );

        headRow.innerHTML = "";

        columnas.forEach(col=>{

            const th = document.createElement("th");

            th.textContent = col.title;

            headRow.appendChild(th);

        });

    }

    //--------------------------------------------------
    // Render (esquema + filas ya resueltos por el backend)
    //--------------------------------------------------

    function render(hoja, resultado){

        // Si el usuario cambió de hoja antes de que esto llegara,
        // esta respuesta ya es vieja — no pisar lo que se está
        // mostrando ahora (la respuesta de la hoja actual, si no
        // llegó todavía, va a hacer su propio render cuando llegue).

        if(hoja !== currentHoja){

            console.log(

                "[SIG.Table] respuesta vieja descartada:",
                hoja,
                "(hoja actual:", currentHoja + ")"

            );

            return;

        }

        console.log(

            "[SIG.Table] render — columnas de esquema:",
            resultado.schema.length,
            "filas:",
            resultado.rows.length

        );

        SIG.Loading.hide();

        if(dataTable){

            dataTable.destroy();

            dataTable = null;

        }

        const columnas = buildColumns(resultado.schema);

        // Sin columnas configuradas (CONFIGURACION_COLUMNAS sin filas
        // para esta hoja) DataTables no tiene con qué armar la tabla —
        // se muestra un aviso en vez de intentar dibujarla vacía.

        const vacio = columnas.length === 0;

        document

            .getElementById("sig-table-vacio")

            .classList.toggle("d-none", !vacio);

        document

            .getElementById("sig-table-contenido")

            .classList.toggle("d-none", vacio);

        if(vacio){

            return;

        }

        resetTableElement();

        buildHead(columnas);

        dataTable = $("#sig-table-datatable").DataTable({

            data    : resultado.rows,

            columns : columnas,

            language: {

                url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"

            }

        });

    }

    //--------------------------------------------------
    // Volver a pedir los datos de la hoja actual (después de
    // crear/editar un registro) — a diferencia de show(), no
    // se corta por el chequeo de "ya estaba cargada".
    //--------------------------------------------------

    function reload(){

        if(!currentHoja){

            return;

        }

        SIG.Loading.show("Actualizando " + currentHoja + "...");

        SIG.Utils

            .run("SIG_UD_get", currentHoja)

            .then(resultado => render(currentHoja, resultado))

            .catch(onError);

    }

    //--------------------------------------------------
    // Eliminar (baja lógica) un registro de la hoja actual
    //--------------------------------------------------

    async function eliminar(fila){

        const seguro = await SIG.Utils.confirmar({

            titulo: "¿Eliminar el registro con ID " + fila.ID + "?",

            texto: "No se borra la fila de la hoja, queda marcada como " +
                   "eliminada y deja de aparecer en tabla/mapa/resumen.",

            confirmarTexto: "Eliminar"

        });

        if(!seguro){

            return;

        }

        SIG.Loading.show("Eliminando...");

        SIG.Utils

            .run("SIG_UD_delete", currentHoja, fila.ID)

            .then(reload)

            .catch(error=>{

                console.error("[SIG.Table] error en SIG_UD_delete:", error);

                SIG.Loading.error(

                    "No se pudo eliminar: " + error.message

                );

            });

    }

    //--------------------------------------------------

    function onError(error){

        console.error("[SIG.Table] error en SIG_UD_get:", error);

        // Se cancela el "ya estaba cargada" para que un reintento
        // (volver a clickear el mismo botón) sí vuelva a pedir datos.

        currentHoja = null;

        SIG.Loading.error(

            "No se pudo cargar la tabla: " + error.message

        );

    }

    //--------------------------------------------------

    function init(){

        document

            .getElementById("btn-table-volver-mapa")

            .onclick = hide;

        document

            .getElementById("btn-table-nuevo-registro")

            .onclick = ()=>{

                if(currentHoja){

                    SIG.Record.open(currentHoja, null, reload);

                }

            };

        // Delegado sobre #sig-table-contenido (no sobre la
        // <table>: resetTableElement() la reemplaza en cada
        // cambio de hoja, un listener puesto directo ahí se
        // perdería con el nodo viejo).

        $("#sig-table-contenido").on(

            "click",
            ".btn-editar-registro",
            function(){

                const fila = dataTable

                    .row($(this).closest("tr"))

                    .data();

                SIG.Record.open(currentHoja, fila, reload);

            }

        );

        $("#sig-table-contenido").on(

            "click",
            ".btn-eliminar-registro",
            function(){

                const fila = dataTable

                    .row($(this).closest("tr"))

                    .data();

                eliminar(fila);

            }

        );

    }

    //--------------------------------------------------

    return{

        init,
        show,
        hide

    };

})();

document.addEventListener("DOMContentLoaded",()=>{

    SIG.Table.init();

});

console.log("[SIG.Table] módulo cargado");

</script>
