<script>

SIG.Modal = (()=>{

    let modal;
    let title;
    let body;
    let close;
    let currentLayer = null;
    let onSave = null;
    let context = {};

    //------------------------------------------------

    function init(){

        modal=document.getElementById("sig-modal");

        title=document.getElementById("sig-modal-title");

        body=document.getElementById("sig-modal-body");

        close=document.getElementById("sig-modal-close");

        close.onclick=hide;

    }

    //------------------------------------------------

    function open(options){

        context = options;

        title.textContent = options.title;

        body.innerHTML = "";

        body.appendChild(

            SIG.Components.clone(options.component)

        );

        modal.style.display = "flex";

        // Hook opcional: correr algo justo después de que el
        // componente ya está clonado en el DOM (precargar campos
        // en modo edición, armar selects que dependen de datos
        // pedidos al backend, etc.) — SIG.Modal no necesita saber
        // nada de geometrías/registros para esto.

        if(options.onOpen){

            options.onOpen(context);

        }

        const btn = body.querySelector("#btn-modal-save");

        if(btn){

            btn.onclick = ()=>{

                if(!context.onSave){

                    hide();

                    return;

                }

                // Mientras la promesa está en vuelo, deshabilitado —
                // sin esto, dos clics rápidos disparan dos guardados
                // (dos filas/geometrías nuevas) antes de que el
                // primero termine y el modal se cierre.

                if(btn.disabled){

                    return;

                }

                btn.disabled = true;

                // onSave puede tardar (google.script.run) — el modal
                // se cierra solo si terminó bien. Si falla, se deja
                // abierto (el error ya se ve en SIG.Loading) para
                // que el usuario pueda corregir y reintentar sin
                // perder lo que había escrito en el formulario.

                Promise.resolve(

                    context.onSave(context)

                ).then(resultado=>{

                    hide();

                    // Hook opcional: avisar a quien abrió el modal
                    // que el guardado terminó bien (p.ej. para que
                    // la tabla se refresque sola con el dato nuevo).

                    if(context.onSaved){

                        context.onSaved(resultado, context);

                    }

                }).catch(error=>{

                    console.error("[SIG.Modal] error al guardar:", error);

                }).finally(()=>{

                    btn.disabled = false;

                });

            };

        }

    }

    //------------------------------------------------

    function hide(){

        modal.style.display="none";

    }

    //------------------------------------------------

    return{

        init,
        open,
        hide

    };

})();

document.addEventListener("DOMContentLoaded",()=>{

    SIG.Modal.init();

});

</script>
