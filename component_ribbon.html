<style>

#sig-ribbon{

    background:#fff;

    border-bottom:1px solid #ced4da;

    box-shadow:0 2px 4px rgba(0,0,0,.08);

    z-index:1000;

}

#sig-ribbon-tabs{

    display:flex;

    border-bottom:1px solid #dee2e6;

    padding:0 10px;

}

#sig-ribbon-body{

    display:flex;

    align-items:stretch;

    min-height:90px;

    padding:8px;

    overflow-x:auto;

}

.ribbon-tab{

    border:none;

    background:none;

    padding:10px 16px;

    font-weight:500;

    cursor:pointer;

}

.ribbon-tab.active{

    border-bottom:3px solid #0d6efd;

    color:#0d6efd;

}

.ribbon-group{

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    padding:0 10px;

    border-right:1px solid #dee2e6;

    min-width:150px;

}

.ribbon-buttons{

    display:flex;

    align-items:flex-start;

    gap:6px;

    flex-wrap:wrap;

}

.ribbon-button{

    width:80px;

    border:none;

    background:none;

    padding:5px 2px;

    border-radius:6px;

    text-align:center;

}

.ribbon-button:hover{

    background:#f3f6fa;

}

.ribbon-button i{

    font-size:24px;

    display:block;

}

.ribbon-button div{

    font-size:.72rem;

    line-height:1.15;

    margin-top:2px;

    overflow-wrap:break-word;

    word-break:break-word;

    white-space:normal;

}

.ribbon-group-title{

    text-align:center;

    font-size:.75rem;

    color:#6c757d;

}

</style>

<div id="sig-ribbon">

    <div id="sig-ribbon-tabs">

    </div>

    <div id="sig-ribbon-body">

    </div>

</div>
