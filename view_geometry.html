<div id="view-geometry"
     data-sig-component
     style="display:none;">

    <div class="container-fluid">

        <!-- ===================================== -->
        <!-- RESUMEN -->
        <!-- ===================================== -->

        <div class="alert alert-primary mb-3">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h6 class="mb-1">
                        Nueva Geometría
                    </h6>

                    <small class="text-muted">

                        Tipo:
                        <span id="geo_tipo">
                            Point
                        </span>

                    </small>

                </div>

                <div>

                    <span
                        id="geo_badge"
                        class="badge bg-secondary">

                        Sin vincular

                    </span>

                </div>

            </div>

        </div>

        <!-- ===================================== -->
        <!-- INFORMACIÓN GENERAL -->
        <!-- ===================================== -->

        <h6 class="border-bottom pb-2 mb-3">

            Información General

        </h6>

        <div class="mb-3">

            <label class="form-label">

                Nombre

            </label>

            <input
                id="geo_nombre"
                class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">

                Descripción

            </label>

            <textarea
                id="geo_descripcion"
                rows="3"
                class="form-control"></textarea>

        </div>

        <!-- ===================================== -->
        <!-- CONFIGURACIÓN -->
        <!-- ===================================== -->

        <h6 class="border-bottom pb-2 mb-3">

            Configuración

        </h6>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Capa

                </label>

                <select
                    id="geo_capa"
                    class="form-select">

                    <option value="">Cargando...</option>

                </select>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Estilo

                </label>

                <select
                    id="geo_estilo"
                    class="form-select">

                    <option value="">Cargando...</option>

                </select>

            </div>

        </div>

        <!-- ===================================== -->
        <!-- VÍNCULO A UN REGISTRO -->
        <!-- ===================================== -->

        <h6 class="border-bottom pb-2 mb-3">

            Registro relacionado (opcional)

        </h6>

        <div class="row mb-4">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Unidad

                </label>

                <select
                    id="geo_hoja"
                    class="form-select">

                    <option value="">Sin vincular</option>

                </select>

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Registro

                </label>

                <select
                    id="geo_registro"
                    class="form-select"
                    disabled>

                    <option value="">—</option>

                </select>

            </div>

        </div>

        <!-- ===================================== -->
        <!-- ACCIONES -->
        <!-- ===================================== -->

        <div class="d-flex justify-content-end gap-2">

          <button
              id="btn-delete-geometry"
              class="btn btn-outline-danger me-auto d-none">

              <i class="bi bi-trash"></i>
              Eliminar

          </button>

          <button
              class="btn btn-outline-secondary"
              onclick="SIG.Modal.hide();">

              <i class="bi bi-x-circle"></i>
              Cancelar

          </button>

          <button
              id="btn-modal-save"
              class="btn btn-primary">

              <i class="bi bi-floppy"></i>
              Guardar

          </button>

      </div>

    </div>

</div>
