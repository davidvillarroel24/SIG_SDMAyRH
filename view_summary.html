<div id="sig-summary-view">

    <div class="d-flex justify-content-between align-items-center p-2 border-bottom bg-white">

        <div>

            <strong>Resumen:</strong>

            <span id="sig-summary-title">
                —
            </span>

        </div>

        <button
            id="btn-summary-volver-mapa"
            class="btn btn-sm btn-outline-secondary">

            <i class="bi bi-map"></i>
            Volver al mapa

        </button>

    </div>

    <div class="d-flex justify-content-between align-items-end p-2 border-bottom">

        <div
            id="sig-summary-filters"
            class="row g-2 flex-grow-1">
        </div>

        <button
            id="btn-summary-limpiar-filtros"
            class="btn btn-sm btn-outline-secondary ms-2">

            <i class="bi bi-x-circle"></i>
            Limpiar filtros

        </button>

    </div>

    <div
        id="sig-summary-cards"
        class="row g-2 p-2">
    </div>

    <div
        id="sig-summary-charts"
        class="row g-2 p-2">
    </div>

</div>
