<script>

window.SIG = {

    version:"0.1",

    modules:{}

};

console.log("MAIN");

console.log(window.SIG);

function initApp(){

    console.log("Motor SIG iniciado");

    // Municipios se pide una sola vez, más abajo con
    // loadConfig("MUNICIPIOS") (línea ~64) — antes también se
    // pedía acá directo, duplicando la lectura de la hoja y el
    // render del panel de capas sin ningún orden garantizado
    // entre las dos respuestas.

    SIG.Loading.show("Cargando geometrías...");

    google.script.run

    .withSuccessHandler(

        items=>{

            SIG.Loading.hide();

            SIG.Features.loadMany(items);

            SIG.DataLayers.renderPanel();

        }

    )

    .withFailureHandler(

        error=>{

            console.error("[initApp] error en SIG_Geometrias_listConRegistros:", error);

            SIG.Loading.error("No se pudieron cargar las geometrías: " + error.message);

        }

    )

    .SIG_Geometrias_listConRegistros();


    loadConfig("MUNICIPIOS");

    loadConfig("PROVINCIAS");

    loadConfig("REGIONES");

    //--------------------------------------------------
    // Estilos
    //--------------------------------------------------

    google.script.run

        .withSuccessHandler(

            SIG.Styles.load

        )

        .SIG_Config_getStyles();

  

}

document.addEventListener("DOMContentLoaded",initApp);

</script>
